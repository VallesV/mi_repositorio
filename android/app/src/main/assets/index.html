<style>
:root{--bg:#f6f1ea;--card:#fffdf9;--line:#e4dbd1;--txt:#17333b;--mut:#718087;--teal:#3d9988;--red:#e7685d;--blue:#4f9bc4}
*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:var(--bg);color:var(--txt);padding-bottom:76px}button,input,select{font:inherit}.hide{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:18px}.box,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}.box{width:min(430px,100%);padding:24px}.brand{font-size:20px;font-weight:900}.mut{color:var(--mut)}.field{margin:12px 0}.field label{display:block;font-weight:800;font-size:12px;margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:white}.btn{border:0;border-radius:12px;padding:11px 13px;font-weight:800}.primary{background:var(--teal);color:#fff}.ghost{background:#ede7e0}.danger{background:var(--red);color:white}.full{width:100%}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button{border:1px solid var(--line);background:white;padding:8px 12px;border-radius:999px}.tabs .on{background:#1f6e7f;color:white}.main{padding:14px 12px}.top{position:sticky;top:0;z-index:5;background:#f6f1eaf2;backdrop-filter:blur(8px);display:flex;justify-content:space-between;align-items:center;padding:8px 0 10px}.amt{font-size:28px;font-weight:900}.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.cards{display:grid;gap:10px}.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #eee5dd}.row:last-child{border:0}.grow{flex:1}.pos{color:#27806e;font-weight:850}.neg{color:#c84f45;font-weight:850}.nav{position:fixed;left:0;right:0;bottom:0;height:68px;background:#fffaf4;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);z-index:20}.nav button{border:0;background:none;font-size:20px}.nav .on{background:#e4f1ed}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#eee8e1;font-size:11px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0 12px}.bar{height:9px;background:#e7dfd7;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:var(--teal)}dialog{border:0;background:transparent;width:min(560px,96vw);max-height:92vh}dialog::backdrop{background:#0006}.modal{background:var(--bg);border-radius:20px;padding:18px;max-height:90vh;overflow:auto}.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#173943;color:white;padding:10px 14px;border-radius:12px;opacity:0;z-index:50}.toast.show{opacity:1}.icon-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.icon-grid button{padding:8px;border:1px solid var(--line);background:white;border-radius:10px;font-size:18px}.color-grid{display:flex;gap:8px;flex-wrap:wrap}.color-grid button{width:28px;height:28px;border-radius:50%;border:2px solid white;outline:1px solid var(--line)}.fab{position:fixed;right:18px;bottom:86px;width:60px;height:60px;border:0;border-radius:50%;background:var(--teal);color:white;font-size:34px;font-weight:400;line-height:1;box-shadow:0 8px 22px #17333b33;z-index:25;display:grid;place-items:center;padding:0}.fab:active{transform:scale(.96)}
</style></head><body>
<section id="app"><main class="main"><div class="top"><div><div id="sub" class="mut">Resumen</div><h2 id="title" style="margin:0">Inicio</h2></div><button id="newBtn" class="btn primary">＋ Nuevo</button></div><div id="screen"></div></main><button id="fabNew" class="fab" aria-label="Agregar movimiento">＋</button><nav class="nav" style="grid-template-columns:repeat(7,1fr)"><button data-v="home" class="on">⌂</button><button data-v="movements">≡</button><button data-v="accounts">💳</button><button data-v="stats">📊</button><button data-v="categories">🏷</button><button data-v="budgets">▣</button><button data-v="settings">⚙</button></nav></section>
<dialog id="modal"><div class="modal"><button class="btn ghost" style="float:right" onclick="modal.close()">×</button><div id="modalBody"></div></div></dialog><div id="toast" class="toast"></div>

const seed={

 categories:[
 {id:"aca910eb-95f2-44ab-bc55-ee288e8492d8",name:"Comida",kind:"expense",icon:"🍽️",color:"#ef7d6d",sort_order:0},
 {id:"ee2c8474-c0c5-411b-9317-75cd7681da18",name:"Transporte",kind:"expense",icon:"🚗",color:"#5b9bd5",sort_order:1},
 {id:"e4dbc07b-ec74-460f-81ce-6130014ade98",name:"Servicios",kind:"expense",icon:"💡",color:"#69b99e",sort_order:2},
 {id:"eb832682-9e22-4c4b-b274-0f1fcd4e6554",name:"Vivienda",kind:"expense",icon:"🏠",color:"#8a82c9",sort_order:3},

 {id:"d23e9786-f507-4c18-ac79-244dfe4f20c2",name:"Otros",kind:"expense",icon:"🧾",color:"#8392a5",sort_order:5},
 {id:"052addbb-2328-476a-bb8f-8049b76512c1",name:"Salud",kind:"expense",icon:"❤️",color:"#ef7d6d",sort_order:6},
 {id:"60705c08-5f4e-465f-822e-5cd597406f2b",name:"Trabajos",kind:"income",icon:"🔧",color:"#e1a649",sort_order:0},
 {id:"bdd5e3e1-6513-4e48-9b9f-8added9ef6ed",name:"Sueldo",kind:"income",icon:"💼",color:"#69b99e",sort_order:1},
 {id:"50f85d92-2bbd-41a7-842b-93b7c6b259dd",name:"Venta",kind:"income",icon:"🛒",color:"#5b9bd5",sort_order:2},
 {id:"55a865bd-ee3b-4bd9-9c0b-8b4b2ffa7ac6",name:"Reintegro",kind:"income",icon:"↩️",color:"#8a82c9",sort_order:3},
 {id:"9468e416-d310-4a99-b6b9-c4b4d685aa69",name:"Otro ingreso",kind:"income",icon:"＋",color:"#8392a5",sort_order:4}],
 movements:[
 {id:"73cb6327-bd21-4b13-bbae-493897b41e57",type:"income",amount:1080276,account_id:"07419525-c5d0-4d68-873e-0047abdb8945",category_id:"bdd5e3e1-6513-4e48-9b9f-8added9ef6ed",note:"Sueldo El doce",occurred_at:"2026-11-02T20:56:30.606Z"},
 {id:"2f9d71e8-ab2f-42af-9a61-79f46468614a",type:"income",amount:6011,account_id:"07419525-c5d0-4d68-873e-0047abdb8945",category_id:"9468e416-d310-4a99-b6b9-c4b4d685aa69",note:"Saldo mes pasado",occurred_at:"2026-11-02T20:57:00.401Z"},
 {id:"77ddcffb-5bfc-4200-a893-b19c8d6a9de9",type:"expense",amount:25508,account_id:"07419525-c5d0-4d68-873e-0047abdb8945",category_id:"d23e9786-f507-4c18-ac79-244dfe4f20c2",note:"Pago mínimo tarjeta",occurred_at:"2026-11-02T20:57:32.068Z"},
 {id:"7e02d9e8-fde9-460a-b406-e445e60224cc",type:"income",amount:13600,account_id:"07419525-c5d0-4d68-873e-0047abdb8945",category_id:"9468e416-d310-4a99-b6b9-c4b4d685aa69",note:"Saldo mes pasado",occurred_at:"2026-11-02T20:58:32.509Z"},
 {id:"b21ffaf7-cd5b-41a0-9957-500311e94a4b",type:"expense",amount:95992.61,account_id:"07419525-c5d0-4d68-873e-0047abdb8945",category_id:"d23e9786-f507-4c18-ac79-244dfe4f20c2",note:"Tarjeta crédito macro",occurred_at:"2026-11-02T21:03:27.990Z"}],
 budgets:{period:"2026-11",limits:{
 "eb832682-9e22-4c4b-b274-0f1fcd4e6554":300000,
 "307fb045-f700-49b2-8d45-ce5726021177":80000,
 "aca910eb-95f2-44ab-bc55-ee288e8492d8":150000,
 "d23e9786-f507-4c18-ac79-244dfe4f20c2":0,
 "052addbb-2328-476a-bb8f-8049b76512c1":0,
 "ee2c8474-c0c5-411b-9317-75cd7681da18":75000,
 "e4dbc07b-ec74-460f-81ce-6130014ade98":50000
 }}
};
let D=JSON.parse(localStorage.getItem("md_local_data")||"null")||clone(seed),view="home";
function save(){localStorage.setItem("md_local_data",JSON.stringify(D))}
function uuid(){return crypto.randomUUID?crypto.randomUUID():"id-"+Date.now()+"-"+Math.random().toString(16).slice(2)}
function toast(t){let e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200)}
function fmt(v,c="ARS"){return new Intl.NumberFormat(c==="ARS"?"es-AR":"en-US",{style:"currency",currency:c,maximumFractionDigits:c==="ARS"?0:2}).format(Number(v)||0)}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function acc(id){return D.accounts.find(x=>x.id===id)} function cat(id){return D.categories.find(x=>x.id===id)}
function monthKey(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function monthMoves(){let k=monthKey();return D.movements.filter(m=>String(m.occurred_at).slice(0,7)===k)}
function totals(){let m=monthMoves();return{
 inc:m.filter(x=>x.type==="income").reduce((s,x)=>s+Number(x.amount),0),
 exp:m.filter(x=>x.type==="expense").reduce((s,x)=>s+Number(x.amount),0),
 avail:D.accounts.filter(a=>a.currency==="ARS"&&a.include_available).reduce((s,a)=>s+Number(a.balance),0),
 pat:D.accounts.filter(a=>a.currency==="ARS").reduce((s,a)=>s+Number(a.balance),0)
}}
function open(h){$("#modalBody").innerHTML=h;$("#modal").showModal()}
function render(){$(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));({home,movements:moves,accounts,stats,categories,budgets,settings}[view]||home)()}
$(".nav button").forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
$("#newBtn").onclick=()=>newMove();
$("#fabNew").onclick=()=>newMove();

function moveRow(m){
 if(m.type==="transfer"){let f=acc(m.from_account_id),t=acc(m.to_account_id);return '<div class="row" onclick="editMovement(\\''+m.id+'\\')"><span>⇄</span><div class="grow"><b>'+esc(m.reason||"Transferencia")+'</b><br><span class="mut">'+esc(f?.name||"")+' → '+esc(t?.name||"")+'</span></div><b>'+fmt(m.amount,f?.currency||"ARS")+'</b></div>'}
 let a=acc(m.account_id),c=cat(m.category_id),sg=m.type==="income"?"+":"−",cl=m.type==="income"?"pos":"neg";
 return '<div class="row" onclick="editMovement(\\''+m.id+'\\')"><span>'+(c?.icon||"🧾")+'</span><div class="grow"><b>'+esc(m.note||c?.name||m.type)+'</b><br><span class="mut">'+new Date(m.occurred_at).toLocaleDateString("es-AR")+' · '+esc(a?.name||"")+'</span></div><b class="'+cl+'">'+sg+' '+fmt(m.amount,a?.currency||"ARS")+'</b></div>'
}
function home(){let t=totals();$("#title").textContent="Inicio";$("#sub").textContent="Todo guardado en este teléfono";$("#screen").innerHTML='<div class="card"><div class="mut">Disponible</div><div class="amt">'+fmt(t.avail)+'</div><div class="mut">Patrimonio ARS: <b>'+fmt(t.pat)+'</b></div></div><div class="grid g2"><div class="card"><div class="mut">Ingresos del mes</div><b>'+fmt(t.inc)+'</b></div><div class="card"><div class="mut">Gastos del mes</div><b>'+fmt(t.exp)+'</b></div></div><h3>Últimos movimientos</h3><div class="card">'+(D.movements.slice().sort((a,b)=>new Date(b.occurred_at)-new Date(a.occurred_at)).slice(0,6).map(moveRow).join("")||'<span class="mut">Sin movimientos</span>')+'</div>'}
function moves(){$("#title").textContent="Movimientos";$("#sub").textContent="Tocá cualquiera para editarlo";$("#screen").innerHTML='<div class="card">'+(D.movements.slice().sort((a,b)=>new Date(b.occurred_at)-new Date(a.occurred_at)).map(moveRow).join("")||'<span class="mut">Sin movimientos</span>')+'</div>'}

function applyMovement(m,sign=1){
 if(m.type==="expense"){let a=acc(m.account_id);if(a)a.balance-=sign*Number(m.amount)}
 else if(m.type==="income"){let a=acc(m.account_id);if(a)a.balance+=sign*Number(m.amount)}
 else if(m.type==="transfer"){let f=acc(m.from_account_id),t=acc(m.to_account_id);if(f)f.balance-=sign*Number(m.amount);if(t)t.balance+=sign*Number(m.to_amount??m.amount)}
}
function canApply(m){
 if(m.type==="expense"){let a=acc(m.account_id);return a&&Number(a.balance)>=Number(m.amount)}
 if(m.type==="transfer"){let a=acc(m.from_account_id);return a&&Number(a.balance)>=Number(m.amount)&&m.from_account_id!==m.to_account_id}
 return true
}
function newMove(){open('<h2>Nuevo movimiento</h2><div class="tabs"><button onclick="moveForm(\\'expense\\')">Gasto</button><button onclick="moveForm(\\'income\\')">Ingreso</button><button onclick="transferForm()">Transferencia</button></div>')}
function moveForm(type,id=""){let m=id?D.movements.find(x=>x.id===id):null,cs=D.categories.filter(c=>c.kind===type);open('<h2>'+(m?"Editar ":"Nuevo ")+(type==="expense"?"gasto":"ingreso")+'</h2><div class="field"><label>Monto</label><input id="ma" type="number" step="0.01" value="'+Number(m?.amount||0)+'"></div><div class="field"><label>Categoría</label><select id="mc">'+cs.map(c=>'<option value="'+c.id+'" '+(m?.category_id===c.id?"selected":"")+'>'+c.icon+' '+esc(c.name)+'</option>').join("")+'</select></div><div class="field"><label>Cuenta</label><select id="macc">'+D.accounts.map(a=>'<option value="'+a.id+'" '+(m?.account_id===a.id?"selected":"")+'>'+a.icon+' '+esc(a.name)+'</option>').join("")+'</select></div><div class="field"><label>Nota</label><input id="mn" value="'+esc(m?.note||"")+'"></div><div class="field"><label>Fecha</label><input id="md" type="date" value="'+String(m?.occurred_at||new Date().toISOString()).slice(0,10)+'"></div><button class="btn primary full" onclick="saveMove(\\''+type+'\\',\\''+id+'\\')">Guardar</button>'+(m?'<button class="btn danger full" style="margin-top:8px" onclick="deleteMovement(\\''+id+'\\')">Eliminar movimiento</button>':""))}
function saveMove(type,id=""){let amt=Number($("#ma").value),old=id?D.movements.find(x=>x.id===id):null;if(amt<=0)return toast("Ingresá un monto válido");if(old)applyMovement(old,-1);let m={id:id||uuid(),type,amount:amt,account_id:$("#macc").value,category_id:$("#mc").value,note:$("#mn").value||"",occurred_at:$("#md").value+"T12:00:00"};if(!canApply(m)){if(old)applyMovement(old,1);return toast("Saldo insuficiente")};applyMovement(m,1);if(old)Object.assign(old,m);else D.movements.push(m);save();modal.close();render();toast(old?"Movimiento actualizado":"Movimiento guardado")}
function transferForm(id=""){let m=id?D.movements.find(x=>x.id===id):null;open('<h2>'+(m?"Editar":"Nueva")+' transferencia</h2><div class="field"><label>Desde</label><select id="tf">'+D.accounts.map(a=>'<option value="'+a.id+'" '+(m?.from_account_id===a.id?"selected":"")+'>'+a.icon+' '+esc(a.name)+'</option>').join("")+'</select></div><div class="field"><label>Hacia</label><select id="tt">'+D.accounts.map(a=>'<option value="'+a.id+'" '+(m?.to_account_id===a.id?"selected":"")+'>'+a.icon+' '+esc(a.name)+'</option>').join("")+'</select></div><div class="field"><label>Monto que sale</label><input id="ta" type="number" step="0.01" value="'+Number(m?.amount||0)+'"></div><div class="field"><label>Monto que llega</label><input id="tb" type="number" step="0.01" value="'+Number(m?.to_amount??m?.amount??0)+'"></div><div class="field"><label>Motivo</label><input id="tr" value="'+esc(m?.reason||"Transferencia propia")+'"></div><button class="btn primary full" onclick="saveTransfer(\\''+id+'\\')">Guardar</button>'+(m?'<button class="btn danger full" style="margin-top:8px" onclick="deleteMovement(\\''+id+'\\')">Eliminar transferencia</button>':""))}
function saveTransfer(id=""){let old=id?D.movements.find(x=>x.id===id):null;if(old)applyMovement(old,-1);let m={id:id||uuid(),type:"transfer",amount:Number($("#ta").value),to_amount:Number($("#tb").value)||Number($("#ta").value),from_account_id:$("#tf").value,to_account_id:$("#tt").value,reason:$("#tr").value||"Transferencia propia",occurred_at:old?.occurred_at||new Date().toISOString()};if(m.amount<=0||!canApply(m)){if(old)applyMovement(old,1);return toast("Revisá monto y cuentas")};applyMovement(m,1);if(old)Object.assign(old,m);else D.movements.push(m);save();modal.close();render();toast("Transferencia guardada")}
function editMovement(id){let m=D.movements.find(x=>x.id===id);if(!m)return;if(m.type==="transfer")transferForm(id);else moveForm(m.type,id)}
function deleteMovement(id){let i=D.movements.findIndex(x=>x.id===id);if(i<0)return;if(!confirm("¿Eliminar este movimiento? El saldo se corregirá automáticamente."))return;applyMovement(D.movements[i],-1);D.movements.splice(i,1);save();modal.close();render();toast("Movimiento eliminado")}

function accounts(){$("#title").textContent="Cuentas";$("#sub").textContent="Saldos locales";$("#screen").innerHTML='<div class="toolbar"><span class="mut">Tocá para editar saldo y datos.</span><button class="btn primary" onclick="editAcc()">＋</button></div><div class="cards">'+D.accounts.map(a=>'<div class="card" onclick="editAcc(\\''+a.id+'\\')"><b>'+a.icon+' '+esc(a.name)+'</b><div class="amt" style="font-size:20px">'+fmt(a.balance,a.currency)+'</div><span class="pill">'+(a.include_available?"Disponible":"Fuera de disponible")+'</span></div>').join("")+'</div>'}
function editAcc(id=""){let a=id?acc(id):null;window.di=a?.icon||"💳";window.dc=a?.color||CO[0];open('<h2>'+(a?"Editar":"Nueva")+' cuenta</h2><div class="field"><label>Nombre</label><input id="an" value="'+esc(a?.name||"")+'"></div><div class="grid g2"><div class="field"><label>Moneda</label><select id="ac">'+["ARS","USD","EUR"].map(x=>'<option '+(a?.currency===x?"selected":"")+'>'+x+'</option>').join("")+'</select></div><div class="field"><label>Saldo actual</label><input id="ab" type="number" step="0.01" value="'+Number(a?.balance||0)+'"></div></div><div class="field"><label>Icono</label><div class="icon-grid">'+IC.map(i=>'<button onclick="window.di=\\''+i+'\\'">'+i+'</button>').join("")+'</div></div><div class="field"><label>Color</label><div class="color-grid">'+CO.map(c=>'<button style="background:'+c+'" onclick="window.dc=\\''+c+'\\'"></button>').join("")+'</div></div><div class="field"><label>Tipo</label><select id="at"><option value="daily">Uso diario</option><option value="cash">Efectivo</option><option value="saving">Ahorro</option><option value="investment">Inversión</option><option value="foreign">Divisa</option></select></div><label><input id="av" type="checkbox" '+(a?.include_available!==false?"checked":"")+'> Incluir en saldo disponible</label><button class="btn primary full" style="margin-top:14px" onclick="saveAcc(\\''+id+'\\')">Guardar</button>')}
function saveAcc(id=""){let b={name:$("#an").value.trim(),currency:$("#ac").value,balance:Number($("#ab").value)||0,type:$("#at").value,include_available:$("#av").checked,icon:window.di,color:window.dc};if(!b.name)return toast("Escribí un nombre");if(id)Object.assign(acc(id),b);else D.accounts.push({id:uuid(),sort_order:D.accounts.length,...b});save();modal.close();render();toast("Cuenta guardada")}

function categories(){$("#title").textContent="Categorías";$("#sub").textContent="Personalizables";$("#screen").innerHTML='<div class="toolbar"><span class="mut">Gastos e ingresos.</span><button class="btn primary" onclick="editCat()">＋</button></div><div class="cards">'+D.categories.map(c=>'<div class="card" onclick="editCat(\\''+c.id+'\\')"><b>'+c.icon+' '+esc(c.name)+'</b><br><span class="pill">'+(c.kind==="expense"?"Gasto":"Ingreso")+'</span></div>').join("")+'</div>'}
function editCat(id=""){let c=id?cat(id):null;window.di=c?.icon||"🧾";window.dc=c?.color||CO[9];open('<h2>'+(c?"Editar":"Nueva")+' categoría</h2><div class="field"><label>Nombre</label><input id="cn" value="'+esc(c?.name||"")+'"></div><div class="field"><label>Tipo</label><select id="ck"><option value="expense" '+(c?.kind==="expense"?"selected":"")+'>Gasto</option><option value="income" '+(c?.kind==="income"?"selected":"")+'>Ingreso</option></select></div><div class="icon-grid">'+IC.map(i=>'<button onclick="window.di=\\''+i+'\\'">'+i+'</button>').join("")+'</div><div class="color-grid" style="margin:12px 0">'+CO.map(x=>'<button style="background:'+x+'" onclick="window.dc=\\''+x+'\\'"></button>').join("")+'</div><button class="btn primary full" onclick="saveCat(\\''+id+'\\')">Guardar</button>')}
function saveCat(id=""){let b={name:$("#cn").value.trim(),kind:$("#ck").value,icon:window.di,color:window.dc};if(!b.name)return toast("Escribí un nombre");if(id)Object.assign(cat(id),b);else D.categories.push({id:uuid(),sort_order:D.categories.length,...b});save();modal.close();render();toast("Categoría guardada")}

function budgets(){let lims=D.budgets?.limits||{},cs=D.categories.filter(c=>c.kind==="expense"),rows=cs.map(c=>{let lim=Number(lims[c.id]||0),spent=monthMoves().filter(m=>m.type==="expense"&&m.category_id===c.id).reduce((s,m)=>s+Number(m.amount),0),p=lim?Math.min(100,spent/lim*100):0;return '<div style="margin:13px 0"><div style="display:flex;justify-content:space-between"><span>'+c.icon+' '+esc(c.name)+'</span><span>'+fmt(spent)+' / '+fmt(lim)+'</span></div><div class="bar"><span style="width:'+p+'%"></span></div></div>'}).join(""),total=cs.reduce((s,c)=>s+Number(lims[c.id]||0),0);$("#title").textContent="Presupuestos";$("#sub").textContent="Total automático";$("#screen").innerHTML='<div class="card"><div class="toolbar"><div><div class="mut">Presupuesto mensual</div><div class="amt" style="font-size:22px">'+fmt(total)+'</div></div><button class="btn ghost" onclick="editBudget()">Editar</button></div>'+rows+'</div>'}
function editBudget(){let lims=D.budgets?.limits||{};open('<h2>Presupuestos</h2><div id="bt" class="amt" style="font-size:22px">'+fmt(0)+'</div>'+D.categories.filter(c=>c.kind==="expense").map(c=>'<div class="field"><label>'+c.icon+' '+esc(c.name)+'</label><input class="bc" data-cat="'+c.id+'" type="number" value="'+Number(lims[c.id]||0)+'" oninput="calcB()"></div>').join("")+'<button class="btn primary full" onclick="saveBudget()">Guardar</button>');calcB()}
function calcB(){let t=$(".bc").reduce((s,i)=>s+(Number(i.value)||0),0);$("#bt").textContent=fmt(t)}
function saveBudget(){D.budgets={period:monthKey(),limits:{}};$(".bc").forEach(i=>D.budgets.limits[i.dataset.cat]=Number(i.value)||0);save();modal.close();render();toast("Presupuesto actualizado")}

function stats(){
 $("#title").textContent="Estadísticas";$("#sub").textContent="Este mes";
 let m=monthMoves(),exp=m.filter(x=>x.type==="expense"),inc=m.filter(x=>x.type==="income");
 let totalExp=exp.reduce((s,x)=>s+Number(x.amount),0),totalInc=inc.reduce((s,x)=>s+Number(x.amount),0);
 let by={};exp.forEach(x=>by[x.category_id]=(by[x.category_id]||0)+Number(x.amount));
 let ranking=Object.entries(by).sort((a,b)=>b[1]-a[1]),top=ranking[0],topCat=top?cat(top[0]):null;
 let rows=ranking.map(([id,v])=>{let c=cat(id),p=totalExp?Math.round(v/totalExp*100):0;return '<div style="margin:14px 0"><div style="display:flex;justify-content:space-between;gap:10px"><span>'+(c?.icon||"🧾")+' '+esc(c?.name||"Sin categoría")+'</span><b>'+fmt(v)+' · '+p+'%</b></div><div class="bar"><span style="width:'+p+'%"></span></div></div>'}).join("");
 let days=[...new Set(exp.map(x=>String(x.occurred_at).slice(0,10)))].length||1;
 let avg=totalExp/days;
 $("#screen").innerHTML='<div class="grid g2"><div class="card"><div class="mut">Gastado</div><div class="amt" style="font-size:22px">'+fmt(totalExp)+'</div></div><div class="card"><div class="mut">Ingresado</div><div class="amt" style="font-size:22px">'+fmt(totalInc)+'</div></div><div class="card"><div class="mut">Balance del mes</div><b class="'+(totalInc-totalExp>=0?"pos":"neg")+'">'+fmt(totalInc-totalExp)+'</b></div><div class="card"><div class="mut">Promedio por día con gastos</div><b>'+fmt(avg)+'</b></div></div><div class="card"><h3>¿En qué gastás más?</h3>'+(top?'<p><b>'+topCat?.icon+' '+esc(topCat?.name||"")+'</b> es tu categoría principal con <b>'+fmt(top[1])+'</b>.</p>': '<p class="mut">Todavía no hay gastos este mes.</p>')+rows+'</div>'
}

function downloadJSON(){let blob=new Blob([JSON.stringify(D,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="mi-dinero-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importJSON(){let inp=document.createElement("input");inp.type="file";inp.accept=".json";inp.onchange=async()=>{try{let o=JSON.parse(await inp.files[0].text());if(!o.accounts||!o.categories||!o.movements)throw Error("Backup inválido");D=o;save();render();toast("Backup importado")}catch(e){toast(e.message)}};inp.click()}
function settings(){$("#title").textContent="Configuración";$("#sub").textContent="Modo local";$("#screen").innerHTML='<div class="card"><h3>Modo local activo</h3><p class="mut">Esta versión no usa Supabase, no necesita cuenta ni conexión para abrir o registrar movimientos.</p></div><div class="card"><h3>Copias de seguridad</h3><p class="mut">Como los datos quedan solo en este teléfono, hacé una copia antes de desinstalar o borrar datos de la app.</p><button class="btn ghost" onclick="downloadJSON()">Exportar backup</button><button class="btn ghost" style="margin-left:8px" onclick="importJSON()">Importar backup</button></div><div class="card"><button class="btn danger full" onclick="if(confirm(\\'¿Restablecer la app a los datos iniciales?\\')){D=clone(seed);save();render()}">Restablecer datos</button></div>'}
render();

</script></body></html>
