<script>
const API="https://jvkftevowfsyyhslnxwf.supabase.co",KEY="sb_publishable_RBDQ85Ke4EF7x_2GEKSzkA_xbtm-YKA",IC=["💳","💵","🏦","🐷","📈","💲","🛒","🍽️","🚗","🏠","🎮","💡","📱","❤️","🎁","💼","🧾","☕"],CO=["#6cb7d8","#69b99e","#ef7d6d","#e1a649","#8a82c9","#5b9bd5","#d281a6","#7aa580","#b58a68","#8392a5"];
let S=JSON.parse(localStorage.getItem("md_session")||"null"),W=null,D={accounts:[],categories:[],movements:[],budgets:[],budget_categories:[],settings:null},view="home",mode="login";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function toast(t){let e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2400)}
function saveS(x){S=x;if(x?.expires_in&&!x.expires_at)x.expires_at=Math.floor(Date.now()/1000)+Number(x.expires_in);localStorage.setItem("md_session",JSON.stringify(x))}
function clearS(){S=null;localStorage.removeItem("md_session")}
function H(auth=true){let h={apikey:KEY,"Content-Type":"application/json"};if(auth&&S?.access_token)h.Authorization="Bearer "+S.access_token;return h}
async function refresh(){if(!S?.refresh_token)return false;try{let r=await fetch(API+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:H(false),body:JSON.stringify({refresh_token:S.refresh_token})}),b=await r.json();if(!r.ok||!b.access_token)return false;saveS(b);return true}catch{return false}}
async function req(p,o={},retry=true){if(o.auth!==false&&S?.expires_at&&S.expires_at-Math.floor(Date.now()/1000)<120)await refresh();let r=await fetch(API+p,{...o,headers:{...H(o.auth!==false),...(o.headers||{})}}),t=await r.text(),b;try{b=t?JSON.parse(t):null}catch{b=t}if((r.status===401||r.status===403)&&retry&&await refresh())return req(p,o,false);if(!r.ok)throw Error(b?.message||b?.error_description||"Error "+r.status);return b}
function fmt(v,c="ARS"){return new Intl.NumberFormat(c==="ARS"?"es-AR":"en-US",{style:"currency",currency:c,maximumFractionDigits:c==="ARS"?0:2}).format(Number(v)||0)}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function uuid(){return crypto.randomUUID()} function mk(){let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function acc(id){return D.accounts.find(x=>x.id===id)} function cat(id){return D.categories.find(x=>x.id===id)}
function monthMoves(){return D.movements.filter(m=>String(m.occurred_at).slice(0,7)===mk())}
function totals(){let m=monthMoves();return{inc:m.filter(x=>x.type==="income").reduce((s,x)=>s+Number(x.amount),0),exp:m.filter(x=>x.type==="expense").reduce((s,x)=>s+Number(x.amount),0),avail:D.accounts.filter(a=>a.currency==="ARS"&&a.include_available).reduce((s,a)=>s+Number(a.balance),0),pat:D.accounts.filter(a=>a.currency==="ARS").reduce((s,a)=>s+Number(a.balance),0)}}

$("#authBtn").onclick=async()=>{try{let email=$("#email").value.trim(),password=$("#pass").value;if(!email||password.length<6)throw Error("Ingresá email y una contraseña de al menos 6 caracteres");let b=mode==="signup"?await req("/auth/v1/signup",{method:"POST",auth:false,body:JSON.stringify({email,password,data:{display_name:$("#name").value.trim()||"Usuario"}})}):await req("/auth/v1/token?grant_type=password",{method:"POST",auth:false,body:JSON.stringify({email,password})});if(!b.access_token){$("#msg").textContent="Cuenta creada. Revisá tu email.";return}saveS(b);await enter()}catch(e){$("#msg").textContent=e.message}};
$("#forgot").onclick=async()=>{let email=$("#email").value.trim();if(!email)return toast("Ingresá tu correo");try{$("#forgot").textContent="Enviando...";let r=await fetch(API+"/auth/v1/recover?redirect_to="+encodeURIComponent("midinero://recovery"),{method:"POST",headers:H(false),body:JSON.stringify({email})}),t=await r.text(),b;try{b=t?JSON.parse(t):null}catch{b=t}if(!r.ok)throw Error(b?.message||"No se pudo enviar");$("#msg").textContent="Correo enviado. Abrí el enlace desde este teléfono."}catch(e){$("#msg").textContent=e.message}finally{$("#forgot").textContent="¿Olvidaste tu contraseña?"}};
async function enter(){$("#auth").classList.add("hide");$("#app").classList.remove("hide");try{await load()}catch{let c=JSON.parse(localStorage.getItem("md_cache")||"null");if(c){W=c.W;D=c.D}else throw Error("Sin conexión")}render()}
async function load(){let ws=await req("/rest/v1/workspaces?select=*&kind=eq.personal&limit=1");W=ws[0];let[a,c,m,b,bc,st]=await Promise.all([req("/rest/v1/accounts?select=*&workspace_id=eq."+W.id+"&archived=eq.false&order=sort_order.asc"),req("/rest/v1/categories?select=*&workspace_id=eq."+W.id+"&archived=eq.false&order=kind.asc,sort_order.asc"),req("/rest/v1/movements?select=*&workspace_id=eq."+W.id+"&order=occurred_at.desc&limit=1000"),req("/rest/v1/budgets?select=*&workspace_id=eq."+W.id),req("/rest/v1/budget_categories?select=*"),req("/rest/v1/user_settings?select=*")]);D={accounts:a||[],categories:c||[],movements:m||[],budgets:b||[],budget_categories:bc||[],settings:st?.[0]||null};localStorage.setItem("md_cache",JSON.stringify({W,D}))}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});$("#newBtn").onclick=()=>newMove();$("#fabNew").onclick=()=>newMove();

function home(){let t=totals();$("#title").textContent="Inicio";$("#sub").textContent="Resumen";$("#screen").innerHTML='<div class="card"><div class="mut">Disponible</div><div class="amt">'+fmt(t.avail)+'</div><div class="mut">Patrimonio ARS: <b>'+fmt(t.pat)+'</b></div></div><div class="grid g2"><div class="card"><div class="mut">Ingresos</div><b>'+fmt(t.inc)+'</b></div><div class="card"><div class="mut">Gastos</div><b>'+fmt(t.exp)+'</b></div></div><h3>Últimos movimientos</h3><div class="card">'+(D.movements.slice(0,6).map(moveRow).join("")||'<span class="mut">Sin movimientos</span>')+'</div>'}

function accounts(){$("#title").textContent="Cuentas";$("#screen").innerHTML='<div class="toolbar"><span class="mut">Tocá para editar saldo y datos.</span><button class="btn primary" onclick="editAcc()">＋</button></div><div class="cards">'+D.accounts.map(a=>'<div class="card" onclick="editAcc(\''+a.id+'\')"><b>'+a.icon+' '+esc(a.name)+'</b><div class="amt" style="font-size:20px">'+fmt(a.balance,a.currency)+'</div><span class="pill">'+(a.include_available?"Disponible":"Fuera de disponible")+'</span></div>').join("")+'</div>'}
function editAcc(id){let a=id?acc(id):null;window.di=a?.icon||"💳";window.dc=a?.color||CO[0];open('<h2>'+(a?"Editar":"Nueva")+' cuenta</h2><div class="field"><label>Nombre</label><input id="an" value="'+esc(a?.name||"")+'"></div><div class="grid g2"><div class="field"><label>Moneda</label><select id="ac">'+["ARS","USD","EUR"].map(x=>'<option '+(a?.currency===x?"selected":"")+'>'+x+'</option>').join("")+'</select></div><div class="field"><label>Saldo actual</label><input id="ab" type="number" step="0.01" value="'+Number(a?.balance||0)+'"></div></div><div class="field"><label>Icono</label><div class="icon-grid">'+IC.map(i=>'<button onclick="window.di=\''+i+'\'">'+i+'</button>').join("")+'</div></div><div class="field"><label>Color</label><div class="color-grid">'+CO.map(c=>'<button style="background:'+c+'" onclick="window.dc=\''+c+'\'"></button>').join("")+'</div></div><div class="field"><label>Tipo</label><select id="at"><option value="daily">Uso diario</option><option value="cash">Efectivo</option><option value="saving">Ahorro</option><option value="investment">Inversión</option><option value="foreign">Divisa</option></select></div><label><input id="av" type="checkbox" '+(a?.include_available!==false?"checked":"")+'> Incluir en saldo disponible</label><button class="btn primary full" style="margin-top:14px" onclick="saveAcc(\''+(id||"")+'\')">Guardar</button>')}
async function saveAcc(id){try{let b={name:$("#an").value.trim(),currency:$("#ac").value,balance:Number($("#ab").value)||0,type:$("#at").value,include_available:$("#av").checked,icon:window.di,color:window.dc};if(id)await req("/rest/v1/accounts?id=eq."+id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(b)});else await req("/rest/v1/accounts",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({id:uuid(),workspace_id:W.id,...b})});modal.close();await load();render()}catch(e){toast(e.message)}}

function budgets(){let b=D.budgets.find(x=>x.period===mk()),cs=D.categories.filter(c=>c.kind==="expense"),rows=cs.map(c=>{let bc=D.budget_categories.find(x=>x.budget_id===b?.id&&x.category_id===c.id),lim=Number(bc?.amount_limit||0),spent=monthMoves().filter(m=>m.type==="expense"&&m.category_id===c.id).reduce((s,m)=>s+Number(m.amount),0),p=lim?Math.min(100,spent/lim*100):0;return '<div style="margin:13px 0"><div style="display:flex;justify-content:space-between"><span>'+c.icon+' '+esc(c.name)+'</span><span>'+fmt(spent)+' / '+fmt(lim)+'</span></div><div class="bar"><span style="width:'+p+'%"></span></div></div>'}).join(""),total=cs.reduce((s,c)=>s+Number(D.budget_categories.find(x=>x.budget_id===b?.id&&x.category_id===c.id)?.amount_limit||0),0);$("#title").textContent="Presupuestos";$("#screen").innerHTML='<div class="card"><div class="toolbar"><div><div class="mut">Total automático</div><div class="amt" style="font-size:22px">'+fmt(total)+'</div></div><button class="btn ghost" onclick="editBudget()">Editar</button></div>'+rows+'</div>'}

async function saveBudget(id){try{let bid=id||uuid(),total=$$(".bc").reduce((s,i)=>s+(Number(i.value)||0),0);if(id)await req("/rest/v1/budgets?id=eq."+id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({total_limit:total})});else await req("/rest/v1/budgets",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({id:bid,workspace_id:W.id,period:mk(),total_limit:total})});for(let i of $$(".bc")){let ex=D.budget_categories.find(x=>x.budget_id===bid&&x.category_id===i.dataset.cat),body={amount_limit:Number(i.value)||0};if(ex)await req("/rest/v1/budget_categories?budget_id=eq."+bid+"&category_id=eq."+i.dataset.cat,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(body)});else await req("/rest/v1/budget_categories",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({budget_id:bid,category_id:i.dataset.cat,...body})})}modal.close();await load();render()}catch(e){toast(e.message)}}
function settings(){$("#title").textContent="Configuración";$("#screen").innerHTML='<div class="card"><h3>Seguridad</h3><p class="mut">La sesión se guarda y se renueva automáticamente.</p><button class="btn ghost" onclick="changePass()">Cambiar contraseña</button><button class="btn danger" onclick="clearS();location.reload()">Cerrar sesión</button></div><div class="card"><h3>Datos</h3><button class="btn ghost" onclick="load().then(render)">Sincronizar ahora</button></div>'}
function changePass(){open('<h2>Nueva contraseña</h2><div class="field"><label>Nueva contraseña</label><input id="p1" type="password"></div><div class="field"><label>Repetir</label><input id="p2" type="password"></div><button class="btn primary full" onclick="savePass()">Guardar</button>')}
async function savePass(){let a=$("#p1").value,b=$("#p2").value;if(a.length<6)return toast("Mínimo 6 caracteres");if(a!==b)return toast("No coinciden");try{await req("/auth/v1/user",{method:"PUT",body:JSON.stringify({password:a})});modal.close();toast("Contraseña actualizada")}catch(e){toast(e.message)}}
window.handleDeepLink=async url=>{try{if(!url?.startsWith("midinero://recovery"))return;let h=url.includes("#")?url.split("#")[1]:"",q=url.includes("?")?url.split("?")[1].split("#")[0]:"",p=new URLSearchParams(h||q),access=p.get("access_token"),refreshToken=p.get("refresh_token"),type=p.get("type");if(type!=="recovery"||!access)throw Error("Enlace inválido o vencido");saveS({access_token:access,refresh_token:refreshToken||"",token_type:"bearer",expires_in:Number(p.get("expires_in")||3600)});$("#auth").classList.add("hide");$("#app").classList.remove("hide");try{await load();render()}catch{}changePass()}catch(e){toast(e.message)}};
(async()=>{if(S?.access_token){if(!S.expires_at||S.expires_at>Math.floor(Date.now()/1000)+120||await refresh())enter().catch(()=>{});else clearS()}})();
